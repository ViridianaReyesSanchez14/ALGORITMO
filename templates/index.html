<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora TSP - Búsqueda Tabú</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Algoritmo de Búsqueda Tabú - TSP</h1>
        <form action="/calcular_ruta" method="POST">
            <label for="tiempo_persistencia">Tiempo de Persistencia:</label>
            <input type="number" name="tiempo_persistencia" value="{{ tiempo_persistencia }}" required>

            <label for="iteraciones">Número de Iteraciones:</label>
            <input type="number" name="iteraciones" value="{{ iteraciones }}" required>

            <label for="temperatura_inicial">Temperatura:</label>
            <input type="number" step="0.1" name="temperatura_inicial" value="{{ temperatura_inicial }}" required>

            <label for="temperatura_minima">Temperatura Mínima:</label>
            <input type="number" step="0.1" name="temperatura_minima" value="{{ temperatura_minima }}" required>

            <label for="velocidad_enfriamiento">Velocidad de Enfriamiento:</label>
            <input type="number" step="0.01" name="velocidad_enfriamiento" value="{{ velocidad_enfriamiento }}" required>

            <label for="ciudad_origen">Ciudad de Origen:</label>
            <select name="ciudad_origen" required>
                <option value="" disabled {% if not ciudad_origen %}selected{% endif %}>Selecciona la ciudad de origen</option>
                <option value="CDMX" {% if ciudad_origen == 'CDMX' %}selected{% endif %}>CDMX</option>
                <option value="Toluca" {% if ciudad_origen == 'Toluca' %}selected{% endif %}>Toluca</option>
                <option value="Atlacomulco" {% if ciudad_origen == 'Atlacomulco' %}selected{% endif %}>Atlacomulco</option>
                <option value="Guadalajara" {% if ciudad_origen == 'Guadalajara' %}selected{% endif %}>Guadalajara</option>
                <option value="Monterrey" {% if ciudad_origen == 'Monterrey' %}selected{% endif %}>Monterrey</option>
                <option value="QuintanaRoo" {% if ciudad_origen == 'QuintanaRoo' %}selected{% endif %}>QuintanaRoo</option>
                <option value="Michohacan" {% if ciudad_origen == 'Michohacan' %}selected{% endif %}>Michohacan</option>
                <option value="Aguascalientes" {% if ciudad_origen == 'Aguascalientes' %}selected{% endif %}>Aguascalientes</option>
                <option value="Jiloyork" {% if ciudad_origen == 'Jiloyork' %}selected{% endif %}>Jiloyork</option>
                <option value="QRO" {% if ciudad_origen == 'QRO' %}selected{% endif %}>QRO</option>
            </select>

            <label for="ciudad_destino">Ciudad de Destino:</label>
            <select name="ciudad_destino" required>
                <option value="" disabled {% if not ciudad_destino %}selected{% endif %}>Selecciona la ciudad de destino</option>
                <option value="CDMX" {% if ciudad_destino == 'CDMX' %}selected{% endif %}>CDMX</option>
                <option value="Toluca" {% if ciudad_destino == 'Toluca' %}selected{% endif %}>Toluca</option>
                <option value="Atlacomulco" {% if ciudad_destino == 'Atlacomulco' %}selected{% endif %}>Atlacomulco</option>
                <option value="Guadalajara" {% if ciudad_destino == 'Guadalajara' %}selected{% endif %}>Guadalajara</option>
                <option value="Monterrey" {% if ciudad_destino == 'Monterrey' %}selected{% endif %}>Monterrey</option>
                <option value="QuintanaRoo" {% if ciudad_destino == 'QuintanaRoo' %}selected{% endif %}>QuintanaRoo</option>
                <option value="Michohacan" {% if ciudad_destino == 'Michohacan' %}selected{% endif %}>Michohacan</option>
                <option value="Aguascalientes" {% if ciudad_destino == 'Aguascalientes' %}selected{% endif %}>Aguascalientes</option>
                <option value="Jiloyork" {% if ciudad_destino == 'Jiloyork' %}selected{% endif %}>Jiloyork</option>
                <option value="QRO" {% if ciudad_destino == 'QRO' %}selected{% endif %}>QRO</option>
            </select>

            <button type="submit">Calcular Mejor Ruta</button>
        </form>

        {% if mejor_solucion %}
        <h2>Mejor Ruta Encontrada</h2>
        <p><strong>Ruta:</strong> {{ mejor_solucion }}</p>
        <p><strong>Distancia Total:</strong> {{ mejor_evaluacion }}</p>
        {% endif %}
    </div>
</body>
</html>
